[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydexception"
version = "0.1.0"
description = "Typed application errors and RFC 9457 responses for FastAPI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "pydemia"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115.12,<1",
  "pydantic>=2.10.1,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.14",
  "pytest>=8",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydexception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pydexception", "examples"]
