name: Package Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a fresh environment
        run: |
          python -m venv /tmp/pydexception-smoke
          /tmp/pydexception-smoke/bin/python -m pip install dist/*.whl httpx
          /tmp/pydexception-smoke/bin/python -c 'from examples.minimal_app import app; from fastapi.testclient import TestClient; r = TestClient(app).get("/items/2"); assert r.status_code == 404 and r.json()["code"] == "item_not_found"'
