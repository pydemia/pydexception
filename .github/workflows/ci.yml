name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        dependencies: ["minimum", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Select minimum supported dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install 'fastapi==0.115.12' 'pydantic==2.10.1'
      - name: Check sources
        run: |
          python -m pytest -q
          ruff check src examples tests scripts
          ruff format --check src examples tests scripts
          mypy src/pydexception examples
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a fresh environment
        run: |
          python -m venv /tmp/pydexception-smoke
          /tmp/pydexception-smoke/bin/python -m pip install dist/*.whl httpx
          /tmp/pydexception-smoke/bin/python -c 'from examples.minimal_app import app; from fastapi.testclient import TestClient; r = TestClient(app).get("/items/2"); assert r.status_code == 404 and r.json()["code"] == "item_not_found"'
