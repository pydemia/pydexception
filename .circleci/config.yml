version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
      dependency-set:
        type: enum
        enum: [minimum, latest]
    docker:
      - image: cimg/python:<< parameters.python-version >>
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install package and test tools
          command: python -m pip install -e '.[dev]'
      - run:
          name: Select minimum supported dependencies
          command: |
            if [ "<< parameters.dependency-set >>" = "minimum" ]; then
              python -m pip install 'fastapi==0.115.12' 'pydantic==2.10.1'
            fi
      - run:
          name: Test, lint, and type-check
          command: |
            python -m pytest -q
            ruff check src examples tests scripts
            ruff format --check src examples tests scripts
            mypy src/pydexception examples

workflows:
  compatibility:
    jobs:
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13"]
              dependency-set: [minimum, latest]
